name: Claude develop

# Develops one issue when, and only when, the label `claude-ready` is added to it.
#
#   preflight  -> plain-code checks: trusted author, label added by someone with write access, dependencies merged,
#                 no open PR already, daily run limit. Refusals are explained in a comment on the issue.
#   develop    -> Claude Code writes the code and tests inside guardrails (see docs/claude-pipeline.md).
#   gates      -> plain-code checks of the result: allowed paths, size, secrets, ruff, pytest, coverage.
#   (repair)   -> one more attempt if the gates failed, told exactly what failed.
#   evaluate   -> an independent reviewer judges every acceptance criterion against evidence.
#   publish    -> commit, push a claude/issue-N-* branch, open a pull request (a draft if anything did not pass).
#
# Nothing is merged and nothing is pushed to the default branch. A person reviews and merges every pull request.
# Issue events use the workflow file on the default branch, so this takes effect once it is merged there.

on:
  issues:
    types: [labeled]

permissions:
  contents: write        # push the work branch (only in the publish step, which is the only one given the token)
  pull-requests: write   # open the pull request
  issues: write          # status comment and labels

concurrency:
  group: claude-develop    # one development run at a time: issues build on each other
  cancel-in-progress: false

jobs:
  develop:
    if: github.event.label.name == 'claude-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      SENDER: ${{ github.event.sender.login }}
      PIPELINE_OUT: /tmp/pipeline-out      # the runner context is not available in job-level env
      PIPELINE_BASE: ${{ github.event.repository.default_branch }}
      # Optional repository variables (Settings > Secrets and variables > Actions > Variables):
      PIPELINE_MODEL: ${{ vars.CLAUDE_PIPELINE_MODEL }}
      PIPELINE_BUDGET_USD: ${{ vars.CLAUDE_PIPELINE_BUDGET_USD || '5' }}
      PIPELINE_MAX_RUNS_PER_DAY: ${{ vars.CLAUDE_PIPELINE_MAX_RUNS_PER_DAY || '6' }}
      PIPELINE_SANDBOX: ${{ vars.CLAUDE_PIPELINE_SANDBOX || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false      # the agent must not find a token in the git config

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the pipeline, the quality tools and the Claude Code CLI
        run: |
          python -m pip install -r pipeline/requirements.txt -r pipeline/requirements-dev.txt
          npm install -g @anthropic-ai/claude-code
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Preflight
        id: pre
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline preflight

      - name: Create the work branch
        if: steps.pre.outputs.proceed == 'true'
        env:
          BRANCH: ${{ steps.pre.outputs.branch }}
        run: git switch -c "$BRANCH"

      - name: Install the project's own dependencies
        if: steps.pre.outputs.proceed == 'true'
        run: |
          if [ -f restaurant/requirements.txt ]; then python -m pip install -r restaurant/requirements.txt; fi

      - name: Check that the command sandbox works (stops here rather than run unsandboxed)
        if: steps.pre.outputs.proceed == 'true' && env.PIPELINE_SANDBOX != '0'
        run: bwrap --ro-bind / / --dev /dev --unshare-pid true

      # The agent steps get the model credential and nothing else: no GitHub token.
      - name: Develop (attempt 1)
        id: dev1
        if: steps.pre.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python -m pipeline develop --attempt 1

      - name: Gates (after attempt 1)
        id: gates1
        if: steps.pre.outputs.proceed == 'true' && steps.dev1.outputs.blocked != 'true'
        run: python -m pipeline gates

      - name: Develop (repair attempt 2)
        id: dev2
        if: steps.pre.outputs.proceed == 'true' && steps.dev1.outputs.blocked != 'true' && steps.gates1.outputs.ok != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python -m pipeline develop --attempt 2

      - name: Gates (after attempt 2)
        if: steps.dev2.conclusion == 'success' && steps.dev2.outputs.blocked != 'true'
        run: python -m pipeline gates

      - name: Independent evaluation
        if: steps.pre.outputs.proceed == 'true' && steps.dev1.outputs.blocked != 'true' && steps.dev2.outputs.blocked != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python -m pipeline evaluate

      # Only this step has the GitHub token.
      - name: Publish (commit, push the branch, open the pull request)
        if: steps.pre.outputs.proceed == 'true' && steps.dev1.outputs.blocked != 'true' && steps.dev2.outputs.blocked != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline publish

      - name: Ask a person (the agent asked a question)
        if: steps.dev1.outputs.blocked == 'true' || steps.dev2.outputs.blocked == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline fail

      - name: Report a failed run
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline fail --reason "A workflow step failed before a pull request was opened. See the run log."

      - name: Keep the traces and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-issue-${{ github.event.issue.number }}
          path: /tmp/pipeline-out/
          if-no-files-found: ignore
          retention-days: 14
