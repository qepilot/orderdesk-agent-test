name: Sandbox debug

# TEMPORARY: runs only for pushes to claude/sandbox-debug-* branches. Never merged. Finds which runner image and settings
# let the Claude Code sandbox run commands. Each probe costs a few cents of model use.

on:
  push:
    branches: ["claude/sandbox-debug-*"]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-latest]
        scrub: ["1", "0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install -q httpx
          npm install -g @anthropic-ai/claude-code
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Environment facts
        run: |
          echo "image: ${{ matrix.os }}  scrub=${{ matrix.scrub }}"
          cat /etc/os-release | head -2; uname -r
          grep -E "^Cap(Eff|Prm|Bnd)" /proc/self/status
          echo "max_user_namespaces: $(cat /proc/sys/user/max_user_namespaces)"
          echo "apparmor_restrict_unprivileged_userns: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>&1)"
          echo "uid map:"; cat /proc/self/uid_map
          echo "--- unshare --user:"; unshare --user --map-root-user id 2>&1 | head -2 || true
          echo "--- bwrap with --unshare-user:"; bwrap --unshare-user --ro-bind / / --dev /dev true 2>&1 | head -3 && echo "bwrap unshare-user ok" || true
          echo "--- container?"; head -3 /proc/1/cgroup; ls /.dockerenv 2>&1 | head -1
      - name: Self-test
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PIPELINE_ENV_SCRUB: ${{ matrix.scrub }}
          PIPELINE_OUT: /tmp/probe-out
        run: python -m pipeline selftest
